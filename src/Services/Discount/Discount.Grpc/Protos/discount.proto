syntax = "proto3";

option csharp_namespace = "Discount.Grpc";

package discount;

// The discount service definition.
service DiscountProtoService {
	// Discount CRUD Operations
	rpc Get (GetRequest) returns (GetResponse);
	rpc GetById (GetByIdRequest) returns (CouponModel);
	rpc GetByName (GetByNameRequest) returns (CouponModel);
	rpc Create (CreateRequest) returns (CouponModel);
	rpc Update (UpdateRequest) returns (CouponModel);
	rpc Delete (DeleteRequest) returns (DeleteResponse);
}

message GetRequest {
}
message GetResponse {
    repeated CouponModel coupons = 1;
}
message GetByIdRequest {
	int32 id = 1;
}
message GetByNameRequest {
	string productName = 1;
}

message CouponModel {
	int32 id = 1;
	string productName = 2;
	string description = 3;
	int32 amount = 4;
}

message CreateRequest {
	CouponModel coupon = 1;
}

message UpdateRequest {
	CouponModel coupon = 1;
}

message DeleteRequest {
	string productName = 1;
}

message DeleteResponse {
	bool success = 1;
}